<!DOCTYPE html>
<html lang="en">
<head>
    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gestión de Cobranza</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

    <div class="contenedor">

        <header>
            <h1><i class="bi bi-cash-coin"></i> Gestión de Cobranza</h1>
            <p>Control y seguimiento de tareas de cobranza</p>
        </header>

        <main>

            <!-- RESUMEN -->
            <section class="resumen">

                <h2>Resumen</h2>

                <div class="estadisticas">

                    <div class="estadistica">
                        <span id="totalTareas">0</span>
                        <p>Total tareas</p>
                    </div>

                    <div class="estadistica">
                        <span id="tareasRealizadas">0</span>
                        <p>Realizadas</p>
                    </div>

                    <div class="estadistica">
                        <span id="tareasPendientes">0</span>
                        <p>Pendientes</p>
                    </div>

                </div>

            </section>


            <!-- LISTA DE TAREAS -->
            <section class="tareas">

                <h2>Mis tareas de cobranza</h2>

                <div class="agregar-tarea">

                    <input
                        type="text"
                        id="inputTarea"
                        placeholder="Ej: Llamar a cliente..."
                    >

                    <button id="btnAgregar">
                        <i class="bi bi-plus-lg"></i>
                        Agregar tarea
                    </button>

                </div>

                <div id="listaTareas"></div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List - Gestión de Cobranza</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Gestión de Cobranza</h1>

        <div class="todo-container">

            <!-- RESUMEN -->

            <aside class="resumen">

                <h2>Resumen</h2>

                <p>
                    Total de tareas:
                    <strong id="totalTareas">0</strong>
                </p>

                <p>
                    Tareas realizadas:
                    <strong id="tareasRealizadas">0</strong>
                </p>

            </aside>


            <!-- TODO LIST -->

            <section class="lista">

                <h2>Mis tareas</h2>

                <div class="agregar">

                    <input
                        type="text"
                        id="inputTarea"
                        placeholder="Escribe una nueva tarea"
                    >

                    <button id="btnAgregar">
                        Agregar tarea
                    </button>

                </div>


                <div id="listaTareas"></div>

            </section>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>

</body>
</html>
