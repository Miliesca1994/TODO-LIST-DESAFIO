<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
</head>
<body>
    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List - Gestión de Cobranza</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Gestión de Cobranza</h1>

        <div class="todo-container">

            <!-- RESUMEN -->

            <aside class="resumen">

                <h2>Resumen</h2>

                <p>
                    Total de tareas:
                    <strong id="totalTareas">0</strong>
                </p>

                <p>
                    Tareas realizadas:
                    <strong id="tareasRealizadas">0</strong>
                </p>

            </aside>


            <!-- TODO LIST -->

            <section class="lista">

                <h2>Mis tareas</h2>

                <div class="agregar">

                    <input
                        type="text"
                        id="inputTarea"
                        placeholder="Escribe una nueva tarea"
                    >

                    <button id="btnAgregar">
                        Agregar tarea
                    </button>

                </div>


                <div id="listaTareas"></div>

            </section>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
</body>
</html>
